</style><script>
(function () {
  var BK = '/api/pcm-booking.php', PCM = '/api/pcm.php';
  var el = document.getElementById('p365app');
  var S = {};
  try { S = JSON.parse(sessionStorage.getItem('p365s') || 'null') || JSON.parse(localStorage.getItem('p365') || '{}'); } catch (e) { S = {}; }
  function saveS() {
    try {
      if (S.staff || S.back) { sessionStorage.setItem('p365s', JSON.stringify(S)); localStorage.removeItem('p365'); }
      else { localStorage.setItem('p365', JSON.stringify(S)); sessionStorage.removeItem('p365s'); }
      if (!S.staff && !S.wtoken) { localStorage.removeItem('p365'); sessionStorage.removeItem('p365s'); }
    } catch (e) {}
  }
  function mid() {
    var m = '';
    try { m = localStorage.getItem('p365mid') || ''; } catch (e) {}
    if (!/^[a-f0-9]{32}$/.test(m)) {
      var a = new Uint8Array(16); crypto.getRandomValues(a); m = '';
      for (var i = 0; i < 16; i++) m += ('0' + a[i].toString(16)).slice(-2);
      try { localStorage.setItem('p365mid', m); } catch (e) {}
    }
    return m;
  }
  function esc(s) { var d = document.createElement('div'); d.textContent = String(s == null ? '' : s); return d.innerHTML; }
  function post(url, body) {
    return fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body), cache: 'no-store' })
      .then(function (r) { return r.json(); });
  }
  function seenTxt(seen) {
    if (!seen) return 'not seen yet';
    var t = Date.parse(seen.replace(' ', 'T') + ':00Z'); if (isNaN(t)) return esc(seen);
    var d = Math.floor((Date.now() - t) / 86400000);
    return d <= 0 ? 'today' : (d === 1 ? 'yesterday' : d + ' days ago');
  }
  function sOut() {
    if (S.stoken) post(BK, { action: 'stafflogout', stoken: S.stoken, machine: mid() });
    if (S.wtoken) post(BK, { action: 'weblogout', wtoken: S.wtoken, machine: mid() });
    S = {}; saveS(); showSignin();
  }
  function topRow(title) {
    return '<div class="ptop"><h1>' + title + '</h1><button class="sm ghost" id="sout">Sign out</button></div>';
  }
  function bindOut() { var b = document.getElementById('sout'); if (b) b.onclick = sOut; }

  // ---------- sign-in ----------
  function showSignin(msg) {
    el.innerHTML = '<h1>Your 365 portal</h1>'
      + '<p class="lede">No passwords here - we send a 6-digit code to type in, and this computer stays signed in. New to 365? The same box joins you free, no card details.</p>'
      + '<div class="card"><h2>Sign in or join free</h2>'
      + '<label>Your email</label><input id="em" type="email" autocomplete="email" />'
      + '<div class="row" style="border:0;padding:.2rem 0 0">'
      + '<button id="cml" class="sm">\u2709 Email me a code</button>'
      + '<button id="csm" class="sm ghost">\ud83d\udcf1 Text me a code</button>'
      + '</div>'
      + '<label style="display:flex;align-items:center;gap:.45rem;margin-top:.55rem;cursor:pointer;color:var(--pmut);font-size:.85rem"><input type="checkbox" id="shpc" style="width:auto" /> This is a shared or public computer</label>'
      + '<div class="err" id="serr">' + (msg || '') + '</div>'
      + '<p class="quiet"><a href="#" id="havecode">Already got a code? Type it here</a>'
      + ' \u00b7 <a href="#" id="pwmode">Prefer your password?</a>'
      + ' \u00b7 Stuck? Ring 01202 775566.</p>'
      + '<div id="pwbox" style="display:none">'
      + '<label>Password</label><input id="pw" type="password" autocomplete="current-password" />'
      + '<label style="display:flex;align-items:center;gap:.45rem;margin-top:.45rem;cursor:pointer;color:var(--pmut);font-size:.85rem"><input type="checkbox" id="pwv" style="width:auto" /> Show password</label>'
      + '<button id="go" class="sm">Sign in with password</button>'
      + '</div>'
      + '<p class="quiet" id="joinnote">First time here? Just pop your email in and tap a code button - that\u2019s the whole sign-up. We\u2019ll ask your name once you\u2019re in if we need it.</p>'
      + '</div>';
    var shared = function () { return document.getElementById('shpc').checked; };
    function sendCode(wantSms) {
      var ce = document.getElementById('em').value.trim();
      if (!ce) { document.getElementById('serr').textContent = 'Pop your email in first.'; return; }
      document.getElementById('serr').textContent = '';
      var btn = document.getElementById(wantSms ? 'csm' : 'cml'); btn.disabled = true;
      post(BK, { action: 'join', email: ce, sms: wantSms ? 1 : 0, machine: mid() })
        .then(function (d) {
          btn.disabled = false;
          if (d && d.ok) {
            if (wantSms && !d.sms) { document.getElementById('serr').textContent = d.mail ? 'We don\u2019t have a mobile on file for that email, so the code went by EMAIL instead.' : 'No mobile on file - try the email code.'; }
            showCode('', ce, d.sms, d.mail, d.slack, false, d.smshint, shared());
          }
          else if (d && d.error === 'throttled' && d.have_code) showCode('', ce, false, true, false, true, '', shared());
          else document.getElementById('serr').textContent =
            d && d.error === 'throttled' ? 'Too many codes requested - wait a while, or ring us: 01202 775566.'
            : d && d.error === 'bad_email' ? 'That email doesn\u2019t look right - please check it.'
            : d && d.error === 'send_failed' ? 'We couldn\u2019t send a code just now - ring us and we\u2019ll sort it: 01202 775566.'
            : 'Something went wrong - try again, or ring 01202 775566.';
        }).catch(function () { btn.disabled = false; document.getElementById('serr').textContent = 'Couldn\u2019t reach the server - try again.'; });
    }
    document.getElementById('cml').onclick = function () { sendCode(false); };
    document.getElementById('csm').onclick = function () { sendCode(true); };
    document.getElementById('havecode').onclick = function () {
      var ce = document.getElementById('em').value.trim();
      if (!ce) { document.getElementById('serr').textContent = 'Pop your email in first, then tap the code link.'; return false; }
      showCode('', ce, false, true, false, true, '', shared());
      return false;
    };
    document.getElementById('pwmode').onclick = function () {
      var pb = document.getElementById('pwbox');
      pb.style.display = pb.style.display === 'none' ? 'block' : 'none';
      if (pb.style.display !== 'none') document.getElementById('pw').focus();
      return false;
    };
    document.getElementById('pwv').onchange = function () { document.getElementById('pw').type = this.checked ? 'text' : 'password'; };
    var go = document.getElementById('go');
    function doIt() {
      go.disabled = true; document.getElementById('serr').textContent = '';
      post(BK, { action: 'signin', email: document.getElementById('em').value.trim(), password: document.getElementById('pw').value, machine: mid(), web: true, shared: shared() ? 1 : 0 })
        .then(function (d) {
          go.disabled = false;
          if (d && d.ok && d.staff) { S = { staff: true, stoken: d.stoken, email: d.customer }; saveS(); showStaff(); }
          else if (d && d.ok && d.wtoken) { S = { wtoken: d.wtoken, name: d.customer, tier: d.tier, pending: !!d.pending }; saveS(); showDash(); }
          else {
            var e2 = d && d.error;
            document.getElementById('serr').textContent =
              e2 === 'throttled' ? 'Too many password tries - wait 15 minutes, or just use a code above: codes still work right now.'
              : (e2 === 'sb_unavailable' || e2 === 'db_unavailable' || e2 === 'not_configured') ? 'We couldn\u2019t reach the booking system - nothing wrong with your details, try again in a minute.'
              : 'That didn\u2019t match - check the password, or just use a code above.';
          }
        }).catch(function () { go.disabled = false; document.getElementById('serr').textContent = 'Couldn\u2019t reach the server - try again.'; });
    }
    go.onclick = doIt;
    document.getElementById('pw').addEventListener('keydown', function (e) { if (e.key === 'Enter') doIt(); });
  }

  // ---------- code entry ----------
  function showCode(jn, je, viaSms, viaMail, viaSlack, existing, smshint, shared) {
    var mobTxt = 'your mobile' + (smshint ? ' ending ' + esc(smshint) : '') + ' by text';
    var sentTo = viaMail && viaSms ? ('<strong>' + esc(je) + '</strong> and ' + mobTxt)
               : viaSms ? mobTxt
               : ('<strong>' + esc(je) + '</strong>');
    if (viaSlack) sentTo += ' (and the 365 Slack)';
    var lede = existing
      ? 'Type the most recent code we sent to <strong>' + esc(je) + '</strong> - the newest one is the one that works (codes last 30 minutes). Check your junk folder too.'
      : 'We\u2019ve sent a 6-digit code to ' + sentTo + '. Type it below - it works for 30 minutes.' + (viaMail ? ' Can\u2019t see it? Check your junk folder.' : '');
    el.innerHTML = '<h1>Type your code</h1>'
      + '<p class="lede">' + lede + '</p>'
      + '<div class="card"><label>Your 6-digit code</label>'
      + '<input id="cd" inputmode="numeric" autocomplete="one-time-code" style="font-size:1.6rem;letter-spacing:.4em;text-align:center;font-family:Consolas,monospace" />'
      + '<button id="cgo">Sign me in</button><div class="err" id="cerr"></div>'
      + '<p class="quiet"><a href="#" id="cback">Wrong email, or need a fresh code? Go back</a></p>'
      + '<p class="quiet">Remember: we never email or text sign-in links - only codes like this. Never read your code to anyone who rings you.<br />Stuck? Ring us on 01202 775566 and we\u2019ll sort it together.</p></div>';
    var cd = document.getElementById('cd'); cd.focus();
    cd.addEventListener('input', function () { cd.value = cd.value.replace(/\D/g, '').slice(0, 6); });
    document.getElementById('cback').onclick = function () { showSignin(); try { document.getElementById('jn').value = jn || ''; document.getElementById('je').value = je || ''; document.getElementById('em').value = je || ''; } catch (e) {} return false; };
    function doV() {
      var cb = document.getElementById('cgo');
      document.getElementById('cerr').textContent = '';
      cb.disabled = true;
      post(BK, { action: 'verifycode', email: je, code: cd.value.trim(), name: jn, machine: mid(), shared: shared ? 1 : 0 })
        .then(function (d) {
          cb.disabled = false;
          if (d && d.ok && d.staff) { S = { staff: true, stoken: d.stoken, email: d.customer }; saveS(); showStaff(); }
          else if (d && d.ok && d.wtoken) { S = { wtoken: d.wtoken, name: d.customer || jn, tier: d.tier, pending: !!d.pending }; saveS(); showDash(); }
          else document.getElementById('cerr').textContent =

  // honest browser check-up: only claims what a browser can genuinely read
  function browserCheck() {
    var b = document.getElementById('bcheck'); if (!b) return;
    var rows = [];
    try {
      var ua = navigator.userAgent || '';
      var w11 = /Windows NT 10/.test(ua);
      if (/Windows/.test(ua)) {
        rows.push(['Windows', w11 ? 'Windows 10 or 11 (browsers can\u2019t tell them apart - the app can)' : 'an older Windows - worth a chat', w11 ? 'g' : 'w']);
      } else if (/Mac/.test(ua)) rows.push(['System', 'a Mac - our app is Windows-only, but we help with Macs too', '']);
      if (navigator.deviceMemory) rows.push(['Memory', navigator.deviceMemory >= 8 ? '8 GB or more - healthy' : ('around ' + navigator.deviceMemory + ' GB - a chat about an upgrade may help'), navigator.deviceMemory >= 8 ? 'g' : 'w']);
      var c = navigator.connection;
      if (c && c.downlink) rows.push(['Connection', 'roughly ' + c.downlink + ' Mbps to this device' + (c.downlink < 10 ? ' - on the slow side' : ' - decent'), c.downlink < 10 ? 'w' : 'g']);
      if (screen && screen.width) rows.push(['Screen', screen.width + '\u00d7' + screen.height, '']);
    } catch (e) {}
    if (!rows.length) { b.innerHTML = '<p class="quiet">This browser keeps its details private - the app sees the honest full picture.</p>'; return; }
    var hh = '<div class="chips">';
    rows.forEach(function (r2) { hh += '<span class="chip ' + r2[2] + '"><strong>' + r2[0] + ':</strong> ' + r2[1] + '</span>'; });
    b.innerHTML = hh + '</div>';
  }

  function fmtTime(tm) {
    if (!tm) return '';
    var hp = tm.split(':'), h = parseInt(hp[0], 10), m = hp[1];
    var ap = h >= 12 ? 'pm' : 'am'; h = h % 12; if (h === 0) h = 12;
    return h + (m === '00' ? '' : ':' + m) + ap;
  }
  function countUp(node, target) {
    var t0 = null;
    function step(ts) {
      if (!t0) t0 = ts;
      var p = Math.min(1, (ts - t0) / 700);
      node.textContent = Math.round(target * (1 - Math.pow(1 - p, 3)));
      if (p < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }

  // ---------- diary: day strip + timeline + customer search ----------
  function loadDiary() {
    post(BK, { action: 'agenda', stoken: S.stoken, machine: mid() }).then(function (d) {
      var v = document.getElementById('dday'); if (!v) return;
      if (!d || !d.ok) {
        v.innerHTML = '<p class="quiet">' + (d && d.error === 'not_configured' ? 'Diary needs the SimplyBook admin key on the server.' : 'Couldn\u2019t load the diary - <a href="#" id="dyr">retry</a>.') + '</p>';
        var r = document.getElementById('dyr'); if (r) r.onclick = function () { loadDiary(); return false; };
        return;
      }
      AG = d.bookings || [];
      if (!selDay) selDay = todayIso();
      buildStrip(); renderDay(selDay);
    }).catch(function () { var v = document.getElementById('dday'); if (v) v.innerHTML = '<p class="quiet">Couldn\u2019t load the diary.</p>'; });
  }
  function buildStrip() {
    var s = document.getElementById('dstrip'); if (!s) return;
    var counts = {};
    (AG || []).forEach(function (b) { if (b.d) counts[b.d] = (counts[b.d] || 0) + 1; });
    var hh = '', names = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
    for (var i = 0; i < 14; i++) {
      var dt = new Date(Date.now() + i * 86400000), di = iso(dt);
      var label = i === 0 ? 'Today' : (i === 1 ? 'Tmrw' : names[dt.getDay()] + ' ' + dt.getDate());
      hh += '<button class="dpill' + (i < 2 ? ' em' : '') + (di === selDay ? ' on' : '') + '" data-d="' + di + '">' + label + (counts[di] ? ' <b>' + counts[di] + '</b>' : '') + '</button>';
    }
    s.innerHTML = hh;
    Array.prototype.forEach.call(s.querySelectorAll('.dpill'), function (b2) {
      b2.onclick = function () { selDay = b2.getAttribute('data-d'); buildStrip(); renderDay(selDay); };
    });
  }
  function bookingRow(b, i, prefix) {
    var chip = b.st === 'completed' ? ' <span class="chip c">✔ completed</span>'
             : b.st === 'confirmed' ? ' <span class="chip g">✓ confirmed</span>' : '';
    var cls = b.st === 'completed' ? ' done' : (b.st === 'confirmed' ? ' confd' : '');
    return '<div class="tline' + cls + '"><span class="ttime">' + fmtTime(b.tm) + '</span><div class="tblock">'
      + '<strong>' + esc(b.who) + '</strong> · ' + esc(b.what) + chip
      + '<br />' + (b.phone ? '<a href="tel:' + esc(b.phone.replace(/\s/g, '')) + '" class="tphone">\ud83d\udcde ' + esc(b.phone) + '</a>' : '<span class="quiet">no number on file - check SimplyBook</span>')
      + '</div>'
      + '<div class="amenu"><button class="sm ghost ab2" data-p="' + prefix + i + '">⋯ Actions</button>'
      + '<div class="adrop" id="ad' + prefix + i + '">'
      + '<button data-act="confirmed" data-id="' + b.id + '">' + (b.st === 'confirmed' ? 'Un-confirm' : '✓ Confirm booking') + '</button>'
      + '<button data-act="completed" data-id="' + b.id + '">' + (b.st === 'completed' ? 'Not completed' : '✔ Service completed') + '</button>'
      + '<button data-act="move" data-id="' + b.id + '" data-p="' + prefix + i + '">↔ Move…</button>'
      + '<button data-act="cancel" data-id="' + b.id + '" style="color:var(--pbad)">✕ Cancel…</button>'
      + '</div></div></div>'
      + '<div class="mvp" id="mvp' + prefix + i + '" style="display:none"></div>';
  }
  function bindBookingButtons(container, list) {
    var byId = {};
    list.forEach(function (b) { byId[b.id] = b; });
    function closeAll() { Array.prototype.forEach.call(container.querySelectorAll('.adrop'), function (x) { x.classList.remove('open'); }); Array.prototype.forEach.call(document.querySelectorAll('#p365app .card.zup'), function (x) { x.classList.remove('zup'); }); }
    Array.prototype.forEach.call(container.querySelectorAll('.ab2'), function (btn) {
      btn.onclick = function (ev) {
        ev.stopPropagation();
        var dropEl = document.getElementById('ad' + btn.getAttribute('data-p'));
        var was = dropEl.classList.contains('open');
        closeAll();
        if (!was) {
          dropEl.classList.add('open');
          // last row / bottom of screen: open UPWARD so Cancel is never cut off
          var rb = btn.getBoundingClientRect();
          dropEl.classList.toggle('up', (window.innerHeight - rb.bottom) < 210);
          // lift this card above its siblings so the menu paints over the next card
          var crd = btn.closest ? btn.closest('.card') : null;
          if (crd) crd.classList.add('zup');
        }
      };
    });
    document.addEventListener('click', closeAll);
    function doCancel(b, btn) {
      if (!confirm('Cancel this booking?\n\n' + b.when + '\n' + b.who + ' - ' + b.what)) return;
      btn.disabled = true;
      post(BK, { action: 'staffcancel', stoken: S.stoken, machine: mid(), id: b.id })
        .then(function (r) { if (r && r.ok) { AG60 = null; loadDiary(); } else { btn.disabled = false; alert('Couldn’t cancel - try again.'); } })
        .catch(function () { btn.disabled = false; alert('Couldn’t reach the server.'); });
    }
    function doStatus(b, btn, kind) {
      var want = (b.st === kind) ? 'none' : kind;
      btn.disabled = true;
      post(BK, { action: 'staffstatus', stoken: S.stoken, machine: mid(), id: b.id, status: want })
        .then(function (r) { if (r && r.ok) { AG60 = null; loadDiary(); } else { btn.disabled = false; alert('Couldn’t update - try again.'); } })
        .catch(function () { btn.disabled = false; alert('Couldn’t reach the server.'); });
    }
    function doMove(b, pid) {
      var p = document.getElementById('mvp' + pid); if (!p) return;
      if (p.style.display !== 'none') { p.style.display = 'none'; return; }
      Array.prototype.forEach.call(container.querySelectorAll('.mvp'), function (x) { x.style.display = 'none'; });
      p.style.display = 'block';
      p.innerHTML = '<p class="quiet">Finding free slots…</p>';
      var from = new Date(), to = new Date(Date.now() + 13 * 86400000);
      post(BK, { action: 'slots', stoken: S.stoken, machine: mid(), eventId: b.eventId, from: iso(from), to: iso(to) })
        .then(function (sr) {
          if (!sr || !sr.ok || !sr.days || !sr.days.length) { p.innerHTML = '<p class="quiet">No free slots in the next two weeks - try SimplyBook admin for further out.</p>'; return; }
          p.innerHTML = '<p class="quiet" style="margin:0 0 .3rem">Move <strong>' + esc(b.who) + '</strong> to:</p><div class="mdays"></div><div class="mtimes" style="margin-top:.3rem"></div>';
          var daysEl = p.querySelector('.mdays'), timesEl = p.querySelector('.mtimes');
          sr.days.forEach(function (day) {
            var db2 = document.createElement('button'); db2.className = 'sm ghost dpill'; db2.textContent = day.n;
            db2.onclick = function () {
              timesEl.innerHTML = '';
              day.t.forEach(function (t) {
                var tb = document.createElement('button'); tb.className = 'sm tpill'; tb.textContent = t;
                tb.onclick = function () {
                  if (!confirm('Move ' + b.who + ' to ' + day.n + ' at ' + t + '?')) return;
                  tb.disabled = true;
                  post(BK, { action: 'staffmove', stoken: S.stoken, machine: mid(), id: b.id, eventId: b.eventId, date: day.d, time: t })
                    .then(function (r) {
                      if (r && r.ok) { AG60 = null; loadDiary(); }
                      else { tb.disabled = false; alert(r && r.error === 'slot_taken' ? 'That slot just went - pick another.' : 'Couldn’t move it - try again.'); }
                    })
                    .catch(function () { tb.disabled = false; alert('Couldn’t reach the server.'); });
                };
                timesEl.appendChild(tb);
              });
            };
            daysEl.appendChild(db2);
          });
          var first = daysEl.querySelector('button'); if (first) first.click();
        })
        .catch(function () { p.innerHTML = '<p class="quiet">Couldn’t load slots - try again.</p>'; });
    }
    Array.prototype.forEach.call(container.querySelectorAll('.adrop button'), function (btn) {
      btn.onclick = function (ev) {
        ev.stopPropagation();
        closeAll();
        var b = byId[parseInt(btn.getAttribute('data-id'), 10)]; if (!b) return;
        var act = btn.getAttribute('data-act');
        if (act === 'cancel') doCancel(b, btn);
        else if (act === 'confirmed' || act === 'completed') doStatus(b, btn, act);
        else if (act === 'move') doMove(b, btn.getAttribute('data-p'));
      };
    });
  }
  function renderDay(dsel) {
    var v = document.getElementById('dday'); if (!v) return;
    var rows = (AG || []).filter(function (b) { return b.d === dsel; })
      .sort(function (a, b) { return (a.tm || '').localeCompare(b.tm || ''); });
    if (!rows.length) { v.innerHTML = '<p class="quiet">Nothing booked ' + (dsel === todayIso() ? 'today' : 'this day') + '.</p>'; return; }
    var hh = '';
    rows.forEach(function (b, i) { hh += bookingRow(b, i, 'd'); });
    v.innerHTML = hh;
    bindBookingButtons(v, rows);
  }
  var searchSeq = 0;
  function doSearch(q) {
    var v = document.getElementById('dday'), s = document.getElementById('dstrip');
    if (!v) return;
    var mySeq = ++searchSeq;
    if (!q || q.length < 2) { if (s) s.style.display = ''; buildStrip(); renderDay(selDay || todayIso()); return; }
    if (s) s.style.display = 'none';
    function run(list) {
      if (mySeq !== searchSeq) return;   // a newer search superseded this one
      try {
        var rows = list.filter(function (b) {
          return (b.who || '').toLowerCase().indexOf(q) >= 0 || (b.phone || '').replace(/\s/g, '').indexOf(q.replace(/\s/g, '')) >= 0;
        });
        if (!rows.length) { v.innerHTML = '<p class="quiet">No upcoming bookings match \u201c' + esc(q) + '\u201d in the next 60 days. (Booked further out? Check SimplyBook admin.)</p>'; return; }
        var hh = '<p class="quiet" style="margin:0 0 .3rem"><strong>' + rows.length + '</strong> upcoming booking' + (rows.length === 1 ? '' : 's') + ' matching \u201c' + esc(q) + '\u201d:</p>';
        var lastD = '';
        rows.forEach(function (b, i) {
          if (b.d !== lastD) { lastD = b.d; hh += '<div class="tgroup">' + esc((b.when || '').split(' ').slice(0, 3).join(' ')) + '</div>'; }
          hh += bookingRow(b, i, 's');
        });
        v.innerHTML = hh;
        bindBookingButtons(v, rows);
      } catch (e) {
        v.innerHTML = '<p class="quiet">Search hit a snag (' + esc(String(e && e.message || e)) + ') - tell 365 and we\u2019ll fix it.</p>';
      }
    }
    if (AG60) { run(AG60); return; }
    v.innerHTML = '<p class="quiet">Searching the next 60 days\u2026</p>';
    post(BK, { action: 'agenda', stoken: S.stoken, machine: mid(), days: 60 }).then(function (d) {
      if (d && d.ok) { AG60 = d.bookings || []; run(AG60); }
      else if (mySeq === searchSeq) v.innerHTML = '<p class="quiet">Couldn\u2019t search just now - try again.</p>';
    }).catch(function () { if (mySeq === searchSeq) v.innerHTML = '<p class="quiet">Couldn\u2019t reach the server.</p>'; });
  }

  // ---------- fleet dashboard ----------
  function fleetWarnings(m, latest) {
    var w = [];
    if (m.fresh) return w;
    if (m.score > 0 && m.score < 55) w.push(['b', 'low health ' + m.score + '%']);
    if ((m.av || '').toUpperCase() === 'OFF') w.push(['b', 'antivirus OFF']);
    if (!m.backup) w.push(['w', 'no backup']);
    if (m.disk >= 85) w.push(['w', 'disk ' + m.disk + '%']);
    if (m.w10) w.push(['w', 'Windows 10']);
    if (m.reboot) w.push(['w', 'restart due']);
    if (latest && m.ver && m.ver < latest) w.push(['w', 'app v' + m.ver]);
    if (m.help) w.push(['b', '\ud83c\udd98 asked for help']);
    return w;
  }
  function loadFleet() {
    post(BK, { action: 'stafffleet', stoken: S.stoken, machine: mid() }).then(function (d) {
      var fv = document.getElementById('ffleet'); if (!fv) return;
      if (!d || !d.ok) { fv.innerHTML = '<p class="quiet">Couldn\u2019t load the fleet - refresh to retry.</p>'; return; }
      var now = Date.now();
      (d.machines || []).forEach(function (m) {
        var t = m.seen ? Date.parse(m.seen.replace(' ', 'T') + ':00Z') : NaN;
        m.on = !isNaN(t) && (now - t) < 70 * 60000;
        m.warns = fleetWarnings(m, d.latest);
      });
      FLEET = d.machines || [];
      var on = FLEET.filter(function (m) { return m.on; }).length;
      var pro = FLEET.filter(function (m) { return m.tier === 'pro'; }).length;
      var warn = FLEET.filter(function (m) { return m.warns.length; }).length;
      var stats = document.getElementById('fstats');
      stats.innerHTML = '<div class="stat"><b data-n="' + FLEET.length + '">0</b><span>PCs with the app</span></div>'
        + '<div class="stat g"><b data-n="' + on + '">0</b><span>on right now</span></div>'
        + '<div class="stat"><b data-n="' + pro + '">0</b><span>on support (Pro)</span></div>'
        + '<div class="stat"><b data-n="' + (FLEET.length - pro) + '">0</b><span>free</span></div>'
        + '<div class="stat' + (warn ? ' w' : '') + '"><b data-n="' + warn + '">0</b><span>with warnings</span></div>';
      Array.prototype.forEach.call(stats.querySelectorAll('[data-n]'), function (n) { countUp(n, parseInt(n.getAttribute('data-n'), 10)); });
      renderFtabs(on);
      renderFleet();
    }).catch(function () { var fv = document.getElementById('ffleet'); if (fv) fv.innerHTML = '<p class="quiet">Couldn\u2019t reach the server.</p>'; });
  }
  function renderFtabs(onCount) {
    var t = document.getElementById('ftabs'); if (!t) return;
    var offCount = FLEET.length - onCount;
    t.innerHTML = '<button data-t="on"' + (ftab === 'on' ? ' class="on"' : '') + '>On now (' + onCount + ')</button>'
      + '<button data-t="off"' + (ftab === 'off' ? ' class="on"' : '') + '>Offline (' + offCount + ')</button>'
      + '<button data-t="all"' + (ftab === 'all' ? ' class="on"' : '') + '>All (' + FLEET.length + ')</button>';
    Array.prototype.forEach.call(t.querySelectorAll('button'), function (b2) {
      b2.onclick = function () { ftab = b2.getAttribute('data-t'); renderFtabs(onCount); renderFleet(); };
    });
  }
  function renderFleet() {
    var fv = document.getElementById('ffleet'); if (!fv) return;
    var rows = FLEET.filter(function (m) { return ftab === 'all' ? true : (ftab === 'on' ? m.on : !m.on); })
      .sort(function (a, b) { return (b.seen || '').localeCompare(a.seen || ''); });
    if (!rows.length) { fv.innerHTML = '<p class="quiet">' + (ftab === 'on' ? 'No customer PCs are on right now.' : 'Nothing here.') + '</p>'; return; }
    var hh = '<table><tr><th></th><th>Computer</th><th>Customer</th><th>Health</th><th>Warnings</th><th>Seen</th><th>App</th></tr>';
    rows.forEach(function (m) {
      var col = m.fresh ? 'var(--pmut)' : (m.score >= 80 ? 'var(--pgood)' : (m.score >= 55 ? 'var(--pwarn)' : 'var(--pbad)'));
      var wch = m.warns.length
        ? m.warns.map(function (w) { return '<span class="chip ' + w[0] + '">' + w[1] + '</span>'; }).join(' ')
        : (m.fresh ? '<span class="chip">first check due</span>' : '<span class="chip g">all good</span>');
      hh += '<tr><td><span class="dot" style="background:' + (m.on ? 'var(--pgood)' : '#44507a') + '" title="' + (m.on ? 'on now' : 'offline') + '"></span></td>'
        + '<td><strong>' + esc(m.name) + '</strong></td>'
        + '<td>' + esc(m.cust) + ' <span class="pill ' + (m.tier === 'pro' ? 'pro">Pro' : 'free">Free') + '</span></td>'
        + '<td><span style="color:' + col + ';font-weight:700">' + (m.fresh ? '\u2014' : m.score + '%') + '</span>' + (m.verdict ? ' <span class="quiet">' + esc(m.verdict) + '</span>' : '') + '</td>'
        + '<td><div class="chips">' + wch + '</div></td>'
        + '<td>' + seenTxt(m.seen) + '</td>'
        + '<td>' + (m.ver ? 'v' + m.ver : '\u2014') + '</td></tr>';
    });
    hh += '</table>';
    fv.innerHTML = hh;
  }

  if (S.stoken) showStaff();
  else if (S.wtoken) showDash();
  else showSignin();
})();
