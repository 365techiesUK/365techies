<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>365 Techies graphics test</title>
<!-- SEAFRONT GAME BENCHMARK (26 Sep 2026). Owner: "when we do the graphics card test on the full service, could it
     run part of our game, like surfing by Bournemouth Pier, and have frames per second as the benchmark".
     PC Service Professional opens THIS page in its own Microsoft Edge window (a throwaway profile, frame cap off)
     and reads the result from the window title - nothing is sent anywhere and nothing is stored:
       365BENCH|v1|ok|avg=71.8|low1=48.2|frames=1795|secs=25.0|w=1280|h=720|scene=surf|gpu=ANGLE (Intel, ...)
       365BENCH|v1|err|<why>
     A FILM, NOT A GAME (27 Sep, owner: "we don't want it to be playable ... it's not going to be probably someone
     in front of the computer ... just do like a cinematic path"). First the dolphins off the pier; then, the same
     night, PIER SURF (owner: "paddling out by Bournemouth Pier and also ducking under the waves ... so you can see
     Bournemouth Pier so everyone will recognise exactly where that is ... showing under the water ... and it saying
     Seafront, the game by 365 Techies, down in one of the corners").
     The game (./, whichever build is live) runs inside the frame at ?mode=surfer, and this page takes the board and
     the camera the way the trailer's film rig does (365-efoil-game tmp-tr201/film/film.mjs + shots/surf-driver.mjs):
       - the driver paddles out through the whitewater and duck-dives each wave as it arrives (the rules card's own
         way; the sea and the board decide everything), called once per physics tick, so it is the same at 30 frames
         a second or 1,500, and the level is restarted as the film starts, so every PC films the same run;
       - the cameras keep the pier in the picture: wide from the beach side, side-on with the pier behind, from
         ahead with the town and the pier behind, and the rider's own eyes; every duck-dive goes UNDER the water -
         through the rider's own eyes (the game's own dive camera), or from below when the water is deep enough.
     The mouse, keys, touch and game controllers reach nothing: a shield covers the frame, focus is kept out of it,
     and the game's input is this page's driver. If a later build no longer has the handles used here, the game's
     own start runs instead and the result says scene=attract - the frame rate is still real. -->
<style>
  html, body { margin: 0; height: 100%; background: #0b1226; overflow: hidden; }
  iframe { border: 0; width: 100%; height: 100%; display: block; }
  #shield { position: fixed; inset: 0; z-index: 2; cursor: none; background: transparent; }
  #cap { position: fixed; left: 0; right: 0; bottom: 0; z-index: 3; padding: 9px 16px; font: 600 15px/1.3 "Segoe UI", system-ui, sans-serif;
         color: #fff; background: rgba(11, 18, 38, .72); pointer-events: none; }
  #st { color: #7fd0ff; font-weight: 400; margin-left: 8px; }
  /* whose game this is, in the corner the whole time (owner, 27 Sep) */
  #badge { position: fixed; left: 14px; top: 12px; z-index: 3; display: flex; align-items: center; gap: 10px; padding: 8px 16px 8px 9px;
           border-radius: 14px; background: rgba(7, 13, 34, .62); border: 1px solid rgba(125, 170, 220, .28); pointer-events: none;
           font-family: "Segoe UI", system-ui, sans-serif; box-shadow: 0 4px 18px rgba(0, 0, 0, .25); }
  #badge img { width: 34px; height: 34px; display: block; }
  #badge b { display: block; color: #fff; font-size: 19px; font-weight: 800; letter-spacing: .16em; line-height: 1.1; }
  #badge span { display: block; color: #7fd0ff; font-size: 12.5px; font-weight: 600; letter-spacing: .02em; margin-top: 1px; }
</style>
</head>
<body>
<iframe id="g" src="./?clean=1&amp;sound=0&amp;mode=surfer" title="Seafront game" tabindex="-1"></iframe>
<div id="shield" aria-hidden="true"></div>
<div id="badge"><img src="/favicon.svg" alt=""><div><b>SEAFRONT</b><span>a Bournemouth game by 365 Techies</span></div></div>
<div id="cap">365 Techies graphics test &ndash; paddling out at Bournemouth Pier <span id="st">loading the game&hellip;</span></div>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var RUN = Math.max(5, Math.min(60, +(q.get('secs') || 25))) * 1000;   // measured seconds
  var WARM = 10000;          // after the film starts: shaders compile and textures stream in - not counted (a 4 s warm-up
                             // left 100-170 ms hitches 3.7-6.8 s into the run on an RTX 3090, 26 Sep)
  var BOOT_LIMIT = 90000;    // slow broadband: the game is a few MB
  var st = document.getElementById('st');
  var f = document.getElementById('g');
  var t0 = performance.now();
  var scene = 'attract';

  // the graphics chip Edge is drawing with - on a laptop with two, usually the power-saving one
  var gpu = '';
  try {
    var c = document.createElement('canvas');
    var gl = c.getContext('webgl2') || c.getContext('webgl');
    if (gl) {
      var ext = gl.getExtension('WEBGL_debug_renderer_info');
      gpu = String(ext ? gl.getParameter(ext.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER) || '');
    }
  } catch (e) { /* no WebGL at all: the game cannot run either, and the boot wait says so */ }
  gpu = gpu.replace(/\|/g, '/').slice(0, 160);

  function done(t, shown) { document.title = t; st.textContent = shown; }

  // NOBODY PLAYS. The shield takes every click, wheel and touch; keys go to whatever has focus, so focus is kept
  // on this page and never in the game's frame (the game's own keys - pause, restart, camera, level switches -
  // are read there, not through the driver below).
  function keepFocus() { try { if (document.activeElement === f) { f.blur(); window.focus(); } } catch (e) { } }
  window.addEventListener('blur', function () { setTimeout(keepFocus, 0); });
  setInterval(keepFocus, 400);

  function gameWindow() { try { return f.contentWindow; } catch (e) { return null; } }
  function canvasOf(w) { try { return w.document.querySelector('canvas'); } catch (e) { return null; } }
  var wrap = function (a) { while (a > Math.PI) a -= 2 * Math.PI; while (a < -Math.PI) a += 2 * Math.PI; return a; };

  // THE DRIVER (365-efoil-game tmp-tr201/film/shots/surf-driver.mjs, the policy tmp-tr201/surf-lab.mjs measured):
  // paddle out to just past the break, duck-diving the whitewater as it arrives; then turn to face the beach, wait
  // for a wave that lifts you, paddle for it, pop up when it carries you and ride it along the face toward the pier.
  // It only drives - the sea and the board (src/boats/surfboard.js) decide everything. Asked every other 1/120 s
  // tick, so its presses last exactly as they did in the film rig (60 a second), whatever the frame rate.
  function driver(E, SF) {
    var D = { ph: 'out', pt: 0, held: 0, last: 0, tick: 0 };
    var out = { lean: 0, turn: 0, throttle: 0, boost: 0, brake: 0 };
    function decide() {
      var B = SF.board(), w = B.wave, tt = E.sim.time;
      var thr = 0, turn = 0, boost = 0;
      var steer = function (hd) { var e = wrap(hd - B.heading); turn = Math.max(-1, Math.min(1, e * 2.5)); return Math.abs(e); };
      var d = SF.dAt(B.x, B.z), shore = -Math.PI / 2;
      if (D.last !== B.state) {
        if ((D.last === 2 || D.last === 3) && B.state === 0) D.ph = d > SF.onset + 4 ? 'turn' : 'out';
        D.last = B.state;
      }
      if (B.state === 0 || B.state === 1) {
        if (D.ph === 'out') {
          var hp = SF.home(); steer(Math.atan2(hp[1] - B.z, hp[0] - B.x)); thr = 1;
          var p = SF.probe(B.x, B.z + 4);
          var here = w.amp > 0.2 && w.brk > 0.5 && w.chi > -1.1 && w.chi < -0.05;
          if ((here || (p.brk > 0.25 && p.chi > -1.4 && p.chi < 0.2 && p.amp > 0.2)) && B.state === 0 && B.cool <= 0) boost = 1;
          if (d > SF.onset + 8) D.ph = 'turn';
        } else if (D.ph === 'turn') { if (steer(shore) < 0.15) D.ph = 'wait'; }
        else if (D.ph === 'wait') {
          steer(shore);
          var p2 = SF.probe(B.x, B.z + 10);
          if (p2.amp > 0.3 && p2.chi > -1.2 && p2.chi < -0.2) { D.ph = 'paddle'; D.pt = tt; }
          if (d < SF.onset - 30) D.ph = 'out';
        } else if (D.ph === 'paddle') {
          steer(shore + 0.25); thr = 1;
          if (B.u >= B.spec.popU && w.face && B.cool <= 0) boost = 1;
          if (!w.face && B.u < 1.2 && tt - D.pt > 4) D.ph = 'wait';
        }
      } else if (B.state === 2) steer(shore + 0.55 * wrap(SF.pierward - shore));
      if (boost && D.held) boost = 0;
      D.held = boost;
      out.throttle = thr; out.turn = turn; out.boost = boost;
    }
    return function () { if ((D.tick++ & 1) === 0) decide(); return out; };
  }

  // THE CAMERAS, cut on the game's own clock so every PC films the same sequence. World-fixed directions, so the
  // pier (66 m west of the surf) stays where the shot put it: +z is out to sea here, SF.pierward points at the pier.
  //   A wide, from the beach side and away from the pier, looking out past the rider - the pier alongside
  //   S side-on, low, from the side away from the pier - the pier behind the rider
  //   F from out to sea, looking back at the rider - the town, the cliffs and the pier behind
  //   P the rider's own eyes (the game's own first-person camera): the hands, the board, the next wave
  // and every duck-dive is its own shot, under the water.
  var CUTS = [[0, 'A'], [6, 'P'], [12, 'S'], [18, 'F'], [24, 'A'], [30, 'S'], [36, 'P'], [42, 'F']];
  var LOOP = ['A', 'S', 'P', 'F'];
  function shotAt(t) {
    if (t >= 48) return LOOP[Math.floor((t - 48) / 6) % LOOP.length];
    var s = 'A'; for (var i = 0; i < CUTS.length; i++) if (t >= CUTS[i][0]) s = CUTS[i][1]; return s;
  }

  function film(w) {
    var E = w.efoil, Hb = E && E.craft, V = E && E.view3d, L = E && E.live, SF = w.efoilSurfer;
    if (!E || !Hb || !V || !L || !E.sim || !SF || !SF.active) return false;
    if (typeof Hb._surfCam !== 'function' || typeof Hb._pov !== 'function' || typeof L.sample !== 'function' || typeof E.setCamera !== 'function') return false;
    if (typeof SF.board !== 'function' || typeof SF.again !== 'function' || typeof SF.probe !== 'function' || typeof SF.dAt !== 'function' || typeof SF.home !== 'function') return false;
    try { if (SF.hud && SF.hud.hideIntro) SF.hud.hideIntro(); } catch (e) { }
    // the only input the board hears from now on; no game controller reaches the page
    L.sample = driver(E, SF);
    try { w.navigator.getGamepads = function () { return []; }; } catch (e) { }
    try { if (V.setMotion) V.setMotion('off'); } catch (e) { }
    // film cameras sit where the shot puts them - not pulled in off the pier as a player's camera is (film.mjs)
    if (typeof Hb._unclip === 'function') Hb._unclip = function () { };
    // a message the underwater camera leaves when the water is too shallow has no place in a film
    try { if (Hb.o && typeof Hb.o.toast === 'function') Hb.o.toast = function () { }; } catch (e) { }
    // watched from outside (the game starts the level through the rider's eyes), and the run from its start
    E.setCamera('chase');
    SF.again();

    var sea = E.sim.sea;
    var pd = [Math.cos(SF.pierward || Math.PI), Math.sin(SF.pierward || Math.PI)], ad = [-pd[0], -pd[1]];
    var C = { t0: E.sim.time, shot: null, R: null, dives: 0, lastState: -1, diveKind: null };
    var os = Hb._surfCam.bind(Hb);
    function look(cam, x, y, z) {
      cam.yaw = Math.atan2(z - cam.z, x - cam.x); cam.pitch = Math.atan2(y - cam.y, Math.hypot(x - cam.x, z - cam.z));
      var Lk = Hb._surfLook; if (Lk) { Lk.x = x; Lk.y = y; Lk.z = z; }
    }
    function aimAlong(cam) {   // keep the game's look point on the view line (it re-aims its dynamics at it)
      var cp = Math.cos(cam.pitch), Lk = Hb._surfLook;
      if (Lk) { Lk.x = cam.x + Math.cos(cam.yaw) * cp * 3; Lk.z = cam.z + Math.sin(cam.yaw) * cp * 3; Lk.y = cam.y + Math.sin(cam.pitch) * 3; }
    }
    Hb._surfCam = function (cam, dt) {
      os(cam, dt);                        // the game's own framing - and its duck-dive decision (Hb._diving)
      dt = Math.max(1 / 240, Math.min(0.1, dt || 1 / 60));
      var h = Hb.hull, t = E.sim.time - C.t0;
      // the rider, smoothed: the board bobs on every wave and a camera nailed to it would too
      if (!C.R) C.R = { x: h.x, y: h.y, z: h.z };
      var k = 1 - Math.exp(-dt * 3);
      C.R.x += (h.x - C.R.x) * k; C.R.z += (h.z - C.R.z) * k; C.R.y += (h.y - C.R.y) * (1 - Math.exp(-dt * 1.5));
      // EVERY DUCK-DIVE GOES UNDER. Alternate dives are seen from below the surface when the water is deep enough
      // for the game's underwater camera (it needs 1.15 m of still water; the paddle-out starts in about 1 m);
      // the rest through the rider's own eyes, the camera the game itself cuts to (b29-b31).
      if (h.state === 1 && C.lastState !== 1) { C.dives++; C.diveKind = (C.dives % 2 === 0) ? 'U' : 'P'; Hb._uc = {}; }
      C.lastState = h.state;
      if (Hb._diving) {
        if (C.diveKind === 'U' && Hb._underCam(cam, dt)) { Hb._povOn = false; V.fovY = 64 * Math.PI / 180; aimAlong(cam); C.shot = 'U'; return; }
        C.shot = 'D'; return;             // the rider's eyes, as the game framed them above
      }
      var name = shotAt(t);
      if (name === 'P') { if (Hb._pov(cam, dt)) { C.shot = 'P'; return; } name = 'S'; }
      Hb._povOn = false;
      var R = C.R, p, tg, fov;
      if (name === 'A') { p = [R.x - 0 * 13 + ad[0] * 7, R.z - 13 + ad[1] * 7, R.y + 4.2]; tg = [R.x + pd[0] * 8, R.z + 12 + pd[1] * 8, R.y + 0.2]; fov = 58; }
      else if (name === 'S') { p = [R.x + ad[0] * 8.5, R.z + 1.5 + ad[1] * 8.5, R.y + 1.4]; tg = [R.x, R.z, R.y + 0.35]; fov = 52; }
      else { p = [R.x + ad[0] * 5, R.z + 8 + ad[1] * 5, R.y + 1.6]; tg = [R.x, R.z, R.y + 0.3]; fov = 55; }
      cam.x = p[0]; cam.z = p[1]; cam.y = p[2];
      // never in the water, whatever a wave does under the lens
      if (sea && sea.sample) { var wy = sea.sample(cam.x, cam.z, E.sim.time, 0, 3).height; if (cam.y < wy + 0.5) cam.y = wy + 0.5; }
      look(cam, tg[0], tg[2], tg[1]);
      V.fovY = fov * Math.PI / 180;
      C.shot = name;
    };
    w.__bench = { C: C, shotAt: shotAt };   // read-only look-in for testing
    return true;
  }

  function waitBoot() {
    var w = gameWindow(), cv = w && canvasOf(w), n = 0;
    try { n = (w && w.__frames) || 0; } catch (e) { n = 0; }
    var waited = performance.now() - t0;
    // the game counts its own frames (window.__frames); if a later build ever drops that, a drawn canvas
    // after 15 s is taken as started
    if (n > 10 || (cv && cv.width > 0 && waited > 15000)) {
      // the game draws before all of it has set up (window.efoil comes last): keep trying for 15 s, and start the
      // warm-up clock once the film is rolling - or once it is given up on, when the game's own start is timed
      st.textContent = 'warming up…';
      var tf = performance.now();
      return (function tryFilm() {
        var ready = false;
        try { ready = !!(w.efoil && w.efoil.craft && w.efoil.craft.hull && w.efoil.sim && w.efoilSurfer && w.efoilSurfer.active); } catch (e) { ready = false; }
        if (ready) { try { if (film(w)) scene = 'surf'; } catch (e) { scene = 'attract'; } }
        if (!ready && performance.now() - tf < 15000) return setTimeout(tryFilm, 250);
        setTimeout(function () { measure(w); }, WARM);
      })();
    }
    if (waited > BOOT_LIMIT) return done('365BENCH|v1|err|the game did not start within ' + Math.round(BOOT_LIMIT / 1000) + ' s' + (gpu ? '' : ' (no WebGL)'), 'the game did not start');
    setTimeout(waitBoot, 250);
  }

  function measure(w) {
    var times = [], stop = false;
    function tick(ts) { if (stop) return; times.push(ts); w.requestAnimationFrame(tick); }
    try { w.requestAnimationFrame(tick); } catch (e) { return done('365BENCH|v1|err|could not time the game', 'could not time the game'); }
    var tStart = performance.now();
    var live = setInterval(function () {
      var n = times.length, s = (performance.now() - tStart) / 1000;
      if (n > 1) st.textContent = Math.round((n - 1) / ((times[n - 1] - times[0]) / 1000)) + ' frames a second – ' + Math.max(0, Math.ceil(RUN / 1000 - s)) + ' s to go';
    }, 500);
    setTimeout(function () {
      stop = true; clearInterval(live);
      if (times.length < 20) return done('365BENCH|v1|err|only ' + times.length + ' frames drawn (window hidden or covered?)', 'too few frames drawn');
      var iv = [];
      for (var i = 1; i < times.length; i++) iv.push(times[i] - times[i - 1]);
      var secs = (times[times.length - 1] - times[0]) / 1000;
      var avg = iv.length / secs;
      // "1% low": the average of the slowest 1% of frames, as frames a second - the stutter a player feels
      var worst = iv.slice().sort(function (a, b) { return b - a; }).slice(0, Math.max(1, Math.floor(iv.length * 0.01)));
      var wsum = 0; for (var j = 0; j < worst.length; j++) wsum += worst[j];
      var low1 = 1000 / (wsum / worst.length);
      var cv = canvasOf(w);
      // diagnostics: the long frames, and when in the run they came (hitches from loading vs steady slowness)
      var longs = [], el = 0, maxIv = 0;
      for (var k = 0; k < iv.length; k++) { el += iv[k]; if (iv[k] > maxIv) maxIv = iv[k]; if (iv[k] > 50 && longs.length < 8) longs.push(Math.round(iv[k]) + '@' + (el / 1000).toFixed(1)); }
      var p99 = iv.slice().sort(function (a, b) { return a - b; })[Math.floor(iv.length * 0.99)];
      done('365BENCH|v1|ok|avg=' + avg.toFixed(1) + '|low1=' + low1.toFixed(1) + '|p99ms=' + p99.toFixed(1) + '|maxms=' + Math.round(maxIv)
        + '|long=' + longs.join(',') + '|frames=' + iv.length + '|secs=' + secs.toFixed(1)
        + '|w=' + (cv ? cv.width : 0) + '|h=' + (cv ? cv.height : 0) + '|scene=' + scene + '|gpu=' + gpu,
        Math.round(avg) + ' frames a second – done');
    }, RUN);
  }

  waitBoot();
})();
</script>
</body>
</html>
