<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>365 Techies graphics test</title>
<!-- SEAFRONT GAME BENCHMARK (26 Sep 2026). Owner: "when we do the graphics card test on the full service, could it
     run part of our game, like surfing by Bournemouth Pier, and have frames per second as the benchmark".
     PC Service Professional opens THIS page in its own Microsoft Edge window (a throwaway profile, frame cap off)
     and reads the result from the window title - nothing is sent anywhere and nothing is stored:
       365BENCH|v1|ok|avg=71.8|low1=48.2|frames=1795|secs=25.0|w=1280|h=720|scene=dolphins|gpu=ANGLE (Intel, ...)
       365BENCH|v1|err|<why>
     27 Sep: A FILM, NOT A GAME. Owner, after the first full service: "we don't want it to be playable ... it's not
     going to be probably someone in front of the computer ... just do like a cinematic path ... in the boat with
     the dolphins". Nobody drives and nobody can: the game (./, whichever build is live) runs inside the frame in
     free ride on the speedboat with its dolphin pod staged just ahead (?dolphins=ride, the game's own review
     handle), and this page takes the boat and the camera the way the trailer's film rig does
     (365-efoil-game tmp-tr201/film/film.mjs + shots/dw-driver.mjs, dw-cine.mjs): a steady wide arc at dolphin-
     watching speed, and cuts between four cameras - high behind, over the helm's shoulder, the bow looking back,
     low alongside with the shore behind. The mouse, keys, touch and game controllers reach nothing: a shield
     covers the frame, focus is kept out of it, and the game's input is this page's driver.
     If a later build no longer has the handles used here, the game's own attract demo runs instead and the
     result says scene=attract - the frame rate is still real. -->
<style>
  html, body { margin: 0; height: 100%; background: #0b1226; overflow: hidden; }
  iframe { border: 0; width: 100%; height: 100%; display: block; }
  #shield { position: fixed; inset: 0; z-index: 2; cursor: none; background: transparent; }
  #cap { position: fixed; left: 0; right: 0; bottom: 0; z-index: 3; padding: 9px 16px; font: 600 15px/1.3 "Segoe UI", system-ui, sans-serif;
         color: #fff; background: rgba(11, 18, 38, .72); pointer-events: none; }
  #st { color: #7fd0ff; font-weight: 400; margin-left: 8px; }
</style>
</head>
<body>
<iframe id="g" src="./?clean=1&amp;sound=0&amp;craft=speedboat&amp;dolphins=ride" title="Seafront game" tabindex="-1"></iframe>
<div id="shield" aria-hidden="true"></div>
<div id="cap">365 Techies graphics test &ndash; out with the dolphins off Bournemouth Pier <span id="st">loading the game&hellip;</span></div>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var RUN = Math.max(5, Math.min(60, +(q.get('secs') || 25))) * 1000;   // measured seconds
  var WARM = 10000;          // after the game draws: shaders compile and textures stream in - not counted (a 4 s warm-up
                             // left 100-170 ms hitches 3.7-6.8 s into the run on an RTX 3090, 26 Sep)
  var BOOT_LIMIT = 90000;    // slow broadband: the game is a few MB
  var st = document.getElementById('st');
  var f = document.getElementById('g');
  var t0 = performance.now();
  var scene = 'attract';

  // the graphics chip Edge is drawing with - on a laptop with two, usually the power-saving one
  var gpu = '';
  try {
    var c = document.createElement('canvas');
    var gl = c.getContext('webgl2') || c.getContext('webgl');
    if (gl) {
      var ext = gl.getExtension('WEBGL_debug_renderer_info');
      gpu = String(ext ? gl.getParameter(ext.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER) || '');
    }
  } catch (e) { /* no WebGL at all: the game cannot run either, and the boot wait says so */ }
  gpu = gpu.replace(/\|/g, '/').slice(0, 160);

  function done(t, shown) { document.title = t; st.textContent = shown; }

  // NOBODY PLAYS. The shield takes every click, wheel and touch; keys go to whatever has focus, so focus is kept
  // on this page and never in the game's frame (the game's own keys - pause, restart, camera, level switches -
  // are read there, not through the driver below).
  function keepFocus() { try { if (document.activeElement === f) { f.blur(); window.focus(); } } catch (e) { } }
  window.addEventListener('blur', function () { setTimeout(keepFocus, 0); });
  setInterval(keepFocus, 400);

  function gameWindow() { try { return f.contentWindow; } catch (e) { return null; } }
  function canvasOf(w) { try { return w.document.querySelector('canvas'); } catch (e) { return null; } }

  // ---- the film: driver + cameras, on the game's own handles (window.efoil) -----------------------------------
  var wrap = function (a) { while (a > Math.PI) a -= 2 * Math.PI; while (a < -Math.PI) a += 2 * Math.PI; return a; };
  var pierDist = function (x, z) { var ax = -224.2, az = -245.3, bx = 17.0, bz = 159.1; var u = Math.max(0, Math.min(1, ((x - ax) * bx + (z - az) * bz) / (bx * bx + bz * bz))); return Math.hypot(x - ax - bx * u, z - az - bz * u); };
  // a point in the boat's frame: ahead (+ along heading), left (+ to port), up
  function rel(h, ahead, left, up) { var c = Math.cos(h.heading), s = Math.sin(h.heading); return { x: h.x + c * ahead - s * left, y: (h.y || 0) + up, z: h.z + s * ahead + c * left }; }

  // THE CIRCLE the boat drives, picked once from where the film starts: tangent to the boat's course, turning to
  // whichever side (and at whichever radius) stays furthest from the pier and the beach and inside the pod's home
  // water. The game spawns the boat heading for the pier head (233 m off the bow), so a late or wrong-way turn
  // meets it: the first try drove straight on for 6 s and struck the pier head at 24 s (27 Sep).
  // dolphin-pod.js: HOME {80, 60, r 230}, rides end 1.9 r from it; the pod keeps 60 m off the pier; beach z -130.
  function pickCircle(h) {
    var best = null, bestS = -1e9, HX = 80, HZ = 60, RIDE = 230 * 1.9;
    for (var s = 1; s >= -1; s -= 2) for (var Rr = 100; Rr <= 140; Rr += 10) {
      var ox = h.x - Math.sin(h.heading) * Rr * s, oz = h.z + Math.cos(h.heading) * Rr * s, sc = 1e9;
      for (var k = 0; k < 48; k++) {
        var a = k / 48 * 2 * Math.PI, px = ox + Math.cos(a) * Rr, pz = oz + Math.sin(a) * Rr;
        sc = Math.min(sc, pierDist(px, pz) - 90, pz + 100, RIDE - 60 - Math.hypot(px - HX, pz - HZ));
      }
      if (sc > bestS) { best = { ox: ox, oz: oz, R: Rr, s: s }; bestS = sc; }
    }
    best.score = Math.round(bestS);
    return best;
  }

  // THE DRIVER (dw-driver.mjs's arc, alone): dolphin-watching speed on that circle - a steady course and a turn of
  // about 0.06 rad/s, well under the pod's "steady" limit (0.10) - so they come to the bow and stay on it.
  // Called once per 1/120 s physics tick, so it behaves the same at 30 frames a second or 1,500.
  function driver(E, circ) {
    var D = { thr: 0.3, turn: 0, circ: circ, t: 0 };
    var out = { lean: 0, turn: 0, throttle: 0, boost: 0, brake: 0 };
    return function (dt) {
      var h = E.craft.hull; dt = dt || 1 / 120; D.t += dt;
      var vT = 7, rmax = 0.085;
      var C = D.circ, rx = h.x - C.ox, rz = h.z - C.oz, rr = Math.hypot(rx, rz) || 1;
      var tx = -rz / rr * C.s, tz = rx / rr * C.s, pull = Math.max(-0.4, Math.min(0.4, (rr - C.R) / 60));
      var want = Math.atan2(tz - rz / rr * pull, tx - rx / rr * pull);
      var err = wrap(want - h.heading);
      var rWant = Math.max(-rmax, Math.min(rmax, err * 0.8));
      D.turn = Math.max(-1, Math.min(1, D.turn + (rWant - (h.r || 0)) * 3 * dt));
      if (Math.abs(err) < 0.02 && Math.abs(rWant) < 0.02) D.turn *= 0.995;
      var ff = 0.2 + vT * 0.025;
      var thrWant = Math.max(0.1, Math.min(0.9, ff + 0.03 * (vT - (h.u || 0))));
      var slew = D.t < 4 ? 0.5 : 0.08;
      D.thr += Math.max(-slew * dt, Math.min(slew * dt, thrWant - D.thr));
      out.turn = D.turn; out.throttle = D.thr;
      return out;
    };
  }

  // THE CAMERAS (dw-cine.mjs), cut on the game's own clock so every PC films the same sequence:
  //   A behind, the pier and the pod ahead   F over the helm's shoulder - in the boat
  //   D the bow, looking back at the riders   S low alongside on the seaward side, the Bournemouth shore behind
  //   W wide from ahead, looking back at the boat with the shore behind
  // The circle takes the boat along the shore towards the pier first, then out to sea (from ~18 s): the shots that
  // look ahead come first, and from then on mostly the ones that look back at the land. The measured 25 s start
  // about 10 s in.
  var CUTS = [[0, 'A'], [6, 'F'], [11, 'S'], [17, 'D'], [23, 'F'], [28, 'W'], [34, 'S'], [40, 'D']];
  var LOOP = ['F', 'W', 'S', 'D'];
  function shotAt(t) {
    if (t >= 46) return LOOP[Math.floor((t - 46) / 6) % LOOP.length];
    var s = 'A'; for (var i = 0; i < CUTS.length; i++) if (t >= CUTS[i][0]) s = CUTS[i][1]; return s;
  }
  function camera(E, C, dtF) {
    var h = E.craft.hull, t = E.sim.time - C.t0;
    var name = shotAt(t);
    if (name !== C.shot) { C.shot = name; C.sm = null; }
    // the seaward side (+z): the boat circles, so it changes - only well past the cross-over, and as a cut
    var lz = Math.cos(h.heading);
    if (!C.side) C.side = lz >= 0 ? 1 : -1;
    if (lz * C.side < -0.35) { C.side = -C.side; C.sm = null; }
    var side = C.side, p, tg, fov, k;
    // A was the film's 15 m crane (-8, 5, 15): from there it looked straight down at plain water. Lower and further
    // back on the seaward side, it keeps the shore, the pier and the sky in the frame.
    if (name === 'A') { p = rel(h, -17, 9 * side, 6.5); tg = rel(h, 10, -2 * side, 0.5); fov = 55; k = 0.05; }
    // F looks further down than the film's (-17 deg -> -26): the pod rides just under the bow wave, not on the horizon
    else if (name === 'F') { p = rel(h, -2.2, 0.35, 3.0); tg = rel(h, 7, 0, -1.5); fov = 78; k = 1; }
    else if (name === 'W') { p = rel(h, 24, 10 * side, 3.5); tg = rel(h, 0, 0, 0.8); fov = 46; k = 0.08; }
    else if (name === 'D') { var w = 0.5 + 0.5 * Math.sin(t * 0.45); p = rel(h, 12, -1.0 + 0.8 * w, 3.6 - 0.4 * w); tg = rel(h, 3.0, 0, 0.4); fov = 56; k = 0.1; }
    else { p = rel(h, 3.2, 13 * side, 1.5); tg = rel(h, 3.0, 0, 0.5); fov = 58; k = 0.06; }
    var c = { x: p.x, y: p.y, z: p.z, tx: tg.x, ty: tg.y, tz: tg.z, fov: fov };
    // smoothing per second, not per frame (the film rig's factors were per 60 fps frame)
    if (!C.sm || k >= 1) C.sm = c;
    else { var kk = 1 - Math.pow(1 - k, Math.min(1, dtF) * 60); for (var key in c) C.sm[key] += (c[key] - C.sm[key]) * kk; }
    return C.sm;
  }

  function film(w) {
    var E = w.efoil, Hb = E && E.craft, V = E && E.view3d, L = E && E.live;
    if (!E || !Hb || !V || !L || !E.sim || typeof Hb._chase !== 'function' || typeof L.sample !== 'function' || !Hb.hull) return false;
    if (Hb.kind !== 'speedboat' || !w.efoilDolphins) return false;
    // the game's attract demo drives until the first key; hand it over with one the game does not use (film.mjs)
    try { w.dispatchEvent(new w.KeyboardEvent('keydown', { key: 'i', code: 'KeyI', keyCode: 73, bubbles: true })); w.dispatchEvent(new w.KeyboardEvent('keyup', { key: 'i', code: 'KeyI', keyCode: 73, bubbles: true })); } catch (e) { return false; }
    // the only input the boat hears from now on
    var circ = pickCircle(Hb.hull);
    L.sample = driver(E, circ);
    // the pod onto the boat's own path, 40 m on round the circle and swimming the same way (the game staged it
    // ahead on the boat's STRAIGHT course, which the turn leaves behind)
    try {
      var h = Hb.hull, arc = 40 / circ.R, cs = Math.cos(h.heading), sn = Math.sin(h.heading);
      var ahead = circ.R * Math.sin(arc), inward = circ.R * (1 - Math.cos(arc)) * circ.s;   // + = to port
      w.efoilDolphins.summon(h.x + cs * ahead - sn * inward, h.z + sn * ahead + cs * inward, 0, h.heading + circ.s * arc);
    } catch (e) { }
    // no game controller reaches the page (the game polls them for its camera and menu buttons)
    try { w.navigator.getGamepads = function () { return []; }; } catch (e) { }
    try { if (V.setMotion) V.setMotion('off'); } catch (e) { }
    var C = { t0: E.sim.time, shot: null, sm: null, side: 0 };
    var oc = Hb._chase.bind(Hb);
    Hb._chase = function (cam, dt) {
      oc(cam, dt);
      var fc = camera(E, C, dt || 1 / 60);
      cam.x = fc.x; cam.y = fc.y; cam.z = fc.z;
      var dx = fc.tx - fc.x, dy = fc.ty - fc.y, dz = fc.tz - fc.z;
      cam.yaw = Math.atan2(dz, dx); cam.pitch = Math.atan2(dy, Math.hypot(dx, dz));
      V.fovY = fc.fov * Math.PI / 180;
    };
    w.__bench = { C: C, shotAt: shotAt, circ: circ };   // read-only look-in for testing
    return true;
  }

  function waitBoot() {
    var w = gameWindow(), cv = w && canvasOf(w), n = 0;
    try { n = (w && w.__frames) || 0; } catch (e) { n = 0; }
    var waited = performance.now() - t0;
    // the game counts its own frames (window.__frames); if a later build ever drops that, a drawn canvas
    // after 15 s is taken as started
    if (n > 10 || (cv && cv.width > 0 && waited > 15000)) {
      // the game draws before all of it has set up (window.efoil comes last): keep trying for 15 s, and start the
      // warm-up clock once the film is rolling - or once it is given up on, when the attract demo is what runs
      st.textContent = 'warming up…';
      var tf = performance.now();
      return (function tryFilm() {
        var ready = false;
        try { ready = !!(w.efoil && w.efoil.craft && w.efoil.craft.hull && w.efoil.sim); } catch (e) { ready = false; }
        if (ready) { try { if (film(w)) scene = 'dolphins'; } catch (e) { scene = 'attract'; } }
        if (!ready && performance.now() - tf < 15000) return setTimeout(tryFilm, 250);
        setTimeout(function () { measure(w); }, WARM);
      })();
    }
    if (waited > BOOT_LIMIT) return done('365BENCH|v1|err|the game did not start within ' + Math.round(BOOT_LIMIT / 1000) + ' s' + (gpu ? '' : ' (no WebGL)'), 'the game did not start');
    setTimeout(waitBoot, 250);
  }

  function measure(w) {
    var times = [], stop = false;
    function tick(ts) { if (stop) return; times.push(ts); w.requestAnimationFrame(tick); }
    try { w.requestAnimationFrame(tick); } catch (e) { return done('365BENCH|v1|err|could not time the game', 'could not time the game'); }
    var tStart = performance.now();
    var live = setInterval(function () {
      var n = times.length, s = (performance.now() - tStart) / 1000;
      if (n > 1) st.textContent = Math.round((n - 1) / ((times[n - 1] - times[0]) / 1000)) + ' frames a second – ' + Math.max(0, Math.ceil(RUN / 1000 - s)) + ' s to go';
    }, 500);
    setTimeout(function () {
      stop = true; clearInterval(live);
      if (times.length < 20) return done('365BENCH|v1|err|only ' + times.length + ' frames drawn (window hidden or covered?)', 'too few frames drawn');
      var iv = [];
      for (var i = 1; i < times.length; i++) iv.push(times[i] - times[i - 1]);
      var secs = (times[times.length - 1] - times[0]) / 1000;
      var avg = iv.length / secs;
      // "1% low": the average of the slowest 1% of frames, as frames a second - the stutter a player feels
      var worst = iv.slice().sort(function (a, b) { return b - a; }).slice(0, Math.max(1, Math.floor(iv.length * 0.01)));
      var wsum = 0; for (var j = 0; j < worst.length; j++) wsum += worst[j];
      var low1 = 1000 / (wsum / worst.length);
      var cv = canvasOf(w);
      // diagnostics: the long frames, and when in the run they came (hitches from loading vs steady slowness)
      var longs = [], el = 0, maxIv = 0;
      for (var k = 0; k < iv.length; k++) { el += iv[k]; if (iv[k] > maxIv) maxIv = iv[k]; if (iv[k] > 50 && longs.length < 8) longs.push(Math.round(iv[k]) + '@' + (el / 1000).toFixed(1)); }
      var p99 = iv.slice().sort(function (a, b) { return a - b; })[Math.floor(iv.length * 0.99)];
      done('365BENCH|v1|ok|avg=' + avg.toFixed(1) + '|low1=' + low1.toFixed(1) + '|p99ms=' + p99.toFixed(1) + '|maxms=' + Math.round(maxIv)
        + '|long=' + longs.join(',') + '|frames=' + iv.length + '|secs=' + secs.toFixed(1)
        + '|w=' + (cv ? cv.width : 0) + '|h=' + (cv ? cv.height : 0) + '|scene=' + scene + '|gpu=' + gpu,
        Math.round(avg) + ' frames a second – done');
    }, RUN);
  }

  waitBoot();
})();
</script>
</body>
</html>
