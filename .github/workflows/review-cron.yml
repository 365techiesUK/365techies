# Fires the customer-email queue processor through the UK day.
# The endpoint is idempotent and unauthenticated BY DESIGN (see api/pcm-review.php:
# exclusive-lock state machine + per-run cap + 60s min interval + 9am-8pm window),
# so this needs no secret. SiteGround's bot wall sometimes intercepts the first
# scripted request with an sgcaptcha interstitial - we try twice, spaced, and
# tolerate both failing: the SimplyBook booking callback also processes the queue
# on every booking event, so the cron is belt-and-braces, not a single point of
# failure.
name: Review email cron

on:
  schedule:
    - cron: "7,37 8-19 * * *"   # every 30 min, 08:07-19:37 UTC: covers 09:00-20:00 UK in winter and summer.
                                # Was every 2h ("17 8-18/2"), but GitHub fired only ~2 of those 6 a day (~15:00 and
                                # ~20:00 UTC, late Oct 2026), and the ~20:00 one lands after the 20:00 cut-off. That
                                # left ONE sending run a day: 3 LinkedIn emails/day instead of the 10/day cap. Extra
                                # runs are harmless (per-run caps, day caps, 60 s ran-recently, queue lock) and the repo
                                # is public, so the minutes are free. Job-done, review, reminder, report and welcome
                                # emails ride the 5-minute SiteGround cron (api/pcm-bkpoll.php); this run is their
                                # fallback and the watchdog for that cron. Since 2 Nov 2026 (when GitHub fired NONE of
                                # these by 12:30) the backfill, LinkedIn and Store review emails ride that cron too,
                                # every 30 min (camp_tick in api/pcm-review.php); this run is their fallback as well.
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger queue processor
        run: |
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"
          curl -sS -A "$UA" --max-time 30 "https://365techies.co.uk/api/pcm-review.php?run=1" || true
          echo
          sleep 45
          curl -sS -A "$UA" --max-time 30 "https://365techies.co.uk/api/pcm-review.php?run=1" || true
