# Deploys the static site to SiteGround over FTPS.
#
# Secrets required (repo -> Settings -> Secrets and variables -> Actions):
#   FTP_HOST      e.g. ftp.365techies.co.uk  (or the SiteGround server hostname)
#   FTP_USER      the FTP account username
#   FTP_PASSWORD  the FTP account password
#   (The FTP account's home directory is set to public_html in SiteGround — i.e. the
#    web root — so files deploy straight into it. No path secret needed.)
#
# Trigger: every push to master, plus manual (Actions tab -> Run workflow).
# The "dry_run" input tests the connection and logs what it WOULD upload, touching
# nothing on the server. It now defaults to FALSE: it defaulted to TRUE to protect
# the pre-cutover WordPress site, which was replaced in June 2026, and that stale
# default meant a manual run left at its defaults produced a fully GREEN run that
# uploaded nothing AND skipped the live-site verify - during an incident that reads
# as "deploy fixed". Pushes were never affected: on a push event the `inputs`
# context is empty, so `inputs.dry_run || false` already evaluated to false.
name: Deploy to SiteGround

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (test connection only, upload nothing)"
        type: boolean
        default: false

concurrency:
  group: deploy-siteground
  cancel-in-progress: false   # let each deploy finish (FTPS is slow); don't cancel mid-upload

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Three upload attempts plus backoff can outlast 20 minutes on a slow full
    # sync, and a timeout kill mid-upload is the worst outcome available.
    # 45, not 30: a CSSV bump rewrites every page, and that 707-file sync took
    # ~28 minutes on 2026-08-19 - the runner then killed the job mid-install and
    # the header smoke test never ran. A skipped guard is the bug it guards
    # against, so the budget has to cover a full-site sync plus the smoke test.
    timeout-minutes: 45
    # ONE copy of the exclude list. It was duplicated per attempt, and a third
    # copy would have made drift near-certain - a list that silently loses
    # "**/*.py" uploads our source to the live web root.
    env:
      FTP_EXCLUDE: |
        **/.git*
        **/.git*/**
        .github/**
        **/*.py
        **/*.md
        wrangler.toml
        victron-vrm-proxy.js
        website-checker-proxy.js
        safe-browsing-proxy.js
        visitors-live-worker.js
        LICENSE*
        .gitignore
        src/**
        *.bat
        index-classic.html
        tools/**
        .smoke/**
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Fail loudly if the exclude list ever resolves to nothing. Belt to the
      # braces of .htaccess denying .py/.toml/.yml: an empty list would also add
      # .git and src/** to the sync, widening a 23 MB upload enough to hit the
      # timeout. A silent widening is the one failure here with no other alarm.
      - name: Sanity-check the exclude list
        run: |
          n=$(printf '%s\n' "$FTP_EXCLUDE" | grep -c '[^[:space:]]' || true)
          echo "exclude patterns: $n"
          if [ "$n" -lt 10 ]; then
            echo "::error title=Exclude list broken::env.FTP_EXCLUDE resolved to $n patterns (expected 17). Refusing to deploy rather than upload source to the live server."
            exit 1
          fi

      # SiteGround's FTPS refuses connections under load: 3 of 4 runs on
      # 2026-08-10 and 2 of 5 on 2026-08-11 died with "Timeout (control socket)".
      # Three attempts with backoff, because two proved not to be enough.
      #
      # ⚠ EVERY attempt carries continue-on-error: true. Without it on the LAST
      # one, that step failing ends the job there - which is exactly how run
      # 31496615312 skipped BOTH the "all attempts failed" annotation and the
      # live-site verify, leaving a bare red X and an unchanged live site.
      # continue-on-error keeps the job alive so the gate below is the ONE place
      # that decides pass/fail.
      # Installed BEFORE the upload on purpose. It does not depend on the deploy,
      # and when it sat after a slow full sync the job timed out mid-install and the
      # smoke test below was skipped without anyone noticing.

      - name: Install headless Chromium for the smoke test
        if: ${{ !(inputs.dry_run || false) }}
        id: chromium
        continue-on-error: true
        shell: bash
        run: |
          set -x
          # Install OUTSIDE the checkout (the repo's own package.json/npmrc would otherwise
          # shape the install), and stay verbose: a tolerant step must still say WHY it fails.
          d="$RUNNER_TEMP/smoke"; mkdir -p "$d" && cd "$d"
          npm init -y
          npm i --no-audit --no-fund playwright@1.47.2
          # --with-deps needs root for apt on the runner
          sudo -E npx playwright install --with-deps chromium
          echo "SMOKE_DIR=$d" >> "$GITHUB_ENV"
          echo "installed"

      - name: Deploy via FTPS (attempt 1)
        id: ftps1
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ./
          protocol: ftps
          timeout: 120000
          dry-run: ${{ inputs.dry_run || false }}
          # The built website only - never source/dev files. Defined once as
          # env.FTP_EXCLUDE at job level so the three attempts cannot drift.
          exclude: ${{ env.FTP_EXCLUDE }}

      # Backoff, not an instant retry: the failure mode is throttling, and
      # hammering the same refusing socket is what made attempt 2 fail too.
      - name: Wait before attempt 2
        if: ${{ steps.ftps1.outcome == 'failure' }}
        run: sleep 45

      - name: Deploy via FTPS (attempt 2)
        id: ftps2
        continue-on-error: true
        if: ${{ steps.ftps1.outcome == 'failure' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ./
          protocol: ftps
          timeout: 120000
          dry-run: ${{ inputs.dry_run || false }}
          # The built website only - never source/dev files. Defined once as
          # env.FTP_EXCLUDE at job level so the three attempts cannot drift.
          exclude: ${{ env.FTP_EXCLUDE }}

      - name: Wait before attempt 3
        if: ${{ steps.ftps1.outcome == 'failure' && steps.ftps2.outcome == 'failure' }}
        run: sleep 90

      - name: Deploy via FTPS (attempt 3)
        id: ftps3
        continue-on-error: true
        if: ${{ steps.ftps1.outcome == 'failure' && steps.ftps2.outcome == 'failure' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ./
          protocol: ftps
          timeout: 120000
          dry-run: ${{ inputs.dry_run || false }}
          # The built website only - never source/dev files. Defined once as
          # env.FTP_EXCLUDE at job level so the three attempts cannot drift.
          exclude: ${{ env.FTP_EXCLUDE }}

      # The ONE gate. A skipped attempt has outcome 'skipped', not 'failure', so
      # this fires only when all three genuinely ran and all three failed.
      - name: Fail if every FTPS attempt failed
        if: ${{ steps.ftps1.outcome == 'failure' && steps.ftps2.outcome == 'failure' && steps.ftps3.outcome == 'failure' }}
        run: |
          echo "::error title=FTPS deploy failed 3x::SiteGround FTPS refused all three attempts — likely down or throttling. Re-run the workflow (Actions -> this run -> Re-run failed jobs)."
          exit 1

      # The portal is the page people keep open, and its updates have "got stuck" before.
      # After every deploy, confirm the LIVE site serves this commit's builds. Outcomes
      # are classified by EVIDENCE (adversarial review finding F4):
      #   - right id                     -> pass
      #   - parseable response, WRONG id -> cannot be the bot wall: true staleness, the
      #     classic differential-FTPS failure (sync state says uploaded, file never
      #     landed). SELF-HEAL: atomically re-upload the file over FTPS and re-check;
      #     still wrong -> hard FAIL so a human looks.
      #   - garbage/challenge/timeout    -> probably sgcaptcha blocking the runner:
      #     warn and pass (a false red deploy would be worse).
      - name: Verify the live portal picked up this build
        if: ${{ !(inputs.dry_run || false) }}
        shell: bash
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -u
          id=$(python3 -c "import json;print(json.load(open('build-id.json'))['id'])")
          fam=$(python3 -c "import json;print(json.load(open('build-id.json'))['family'])")
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 deploy-verify"
          fetch() { curl -sS -A "$UA" --max-time 20 "$1" || true; }
          heal() {  # atomic re-upload: STOR to .new, then server-side rename over the top
            echo "self-heal: re-uploading $1"
            curl -sS --ssl-reqd --user "$FTP_USER:$FTP_PASSWORD" -T "$1" "ftp://$FTP_HOST/$1.new"                  -Q "-RNFR $1.new" -Q "-RNTO $1" && echo "re-uploaded $1" || echo "re-upload of $1 FAILED"
          }
          echo "expecting portal=$id family=$fam"

          # ---- 1. the beacon file ------------------------------------------------
          okj=0
          for i in 1 2 3 4 5; do
            live=$(fetch "https://365techies.co.uk/build-id.json?b=$RANDOM$RANDOM")
            echo "build-id attempt $i: ${live:0:120}"
            case "$live" in
              *"\"$id\""*) okj=1; break ;;
              "{"*"\"id\""*)   # valid-looking JSON with the wrong id = staleness, not bot wall
                heal "build-id.json"; sleep 10
                live=$(fetch "https://365techies.co.uk/build-id.json?b=$RANDOM$RANDOM")
                case "$live" in *"\"$id\""*) okj=1;; esac
                break ;;
              *) sleep 12 ;;
            esac
          done
          if [ "$okj" != "1" ]; then
            case "$live" in
              "{"*) echo "::error title=build-id.json stale::Live beacon still not serving $id after self-heal. Delete .ftp-deploy-sync-state.json on the server and re-deploy."; exit 1 ;;
              *)    echo "::warning title=Verify blocked::Could not read live build-id.json (bot wall or network). Check https://365techies.co.uk/portal/ by hand."; exit 0 ;;
            esac
          fi

          # ---- 2. the pages themselves ------------------------------------------
          check_page() {  # $1 url-path  $2 marker-var  $3 expected-id  $4 file-to-heal
            page=$(fetch "https://365techies.co.uk/$1?u=$3")
            if echo "$page" | grep -qF "$2 = '$3'"; then echo "$1 verified at $3"; return 0; fi
            if echo "$page" | grep -qF "$2 = '"; then   # real page, wrong id: sync skipped it
              heal "$4"; sleep 10
              page=$(fetch "https://365techies.co.uk/$1?u=$3")
              if echo "$page" | grep -qF "$2 = '$3'"; then echo "$1 healed to $3"; return 0; fi
              echo "::error title=$1 stale::$1 still serves an old build after self-heal. Delete .ftp-deploy-sync-state.json on the server and re-deploy."
              return 1
            fi
            echo "::warning title=$1 unreadable::Response was not the page (bot wall?). Check by hand."
            return 0
          }
          check_page "portal/" "P365BUILD" "$id" "portal/index.html" || exit 1
          check_page "family/" "P365FAM" "$fam" "family/index.html" || exit 1

          # ---- 3. regression canary: the no-store header fix must stay live ------
          cc=$(curl -sSI -A "$UA" --max-time 20 "https://365techies.co.uk/portal/" | grep -i "cache-control:" || true)
          echo "portal cache-control: $cc"
          case "$cc" in
            *no-store*) : ;;
            *) echo "::warning title=no-store regressed::/portal/ is no longer served with no-store - check the .htaccess FilesMatch ordering." ;;
          esac

      # ---- 4. header smoke test: open a REAL dropdown on the LIVE homepage --------------
      # Added 2026-08-18 after the 12-17 Aug breakage: a .desktop-nav overflow:hidden
      # clipped every dropdown panel for five days while every check passed, because none
      # of them opened a menu. This one does, in headless Chromium, at 1600 and 1366px, and
      # hit-tests inside the panel (an invisible/clipped panel can never win a hit-test).
      # It also re-checks the SOS button stays on screen. Runs only when a deploy actually
      # happened (the FTPS gate above passed). Browser install is separate + tolerant so a
      # CDN hiccup reads as "smoke skipped", not "site broken".

      - name: Header smoke test (dropdowns open, SOS on screen)
        if: ${{ !(inputs.dry_run || false) && steps.chromium.outcome == 'success' }}
        shell: bash
        run: |
          cp tools/smoke-header.mjs "$SMOKE_DIR/smoke-header.mjs"
          cd "$SMOKE_DIR" && node smoke-header.mjs

      - name: Smoke test skipped
        if: ${{ !(inputs.dry_run || false) && steps.chromium.outcome != 'success' }}
        shell: bash
        run: echo "::warning title=Header smoke skipped::Chromium install failed on the runner; the dropdown/SOS smoke test did not run. Check the header by hand (open a menu)."
